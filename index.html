<body>
  <div class="body-wrapper">
    <div class="main-content">
      <div class="main-container">
        <div class="navigation-section">
          <a href="html/web.html" class="chapter">web</a><br>
          <a href="html/project.html" class="chapter">project</a><br>
          <a href="html/art.html" class="chapter">art</a><br>
          <a href="html/about.html" class="chapter">about</a>
        </div>
        <div class="random-section">
          <!-- Случайное фото из imgfromgallery/: при каждом заходе своё,
               по клику меняется. Пока скрипт не выбрал фото, блок скрыт;
               на телефоне его нет совсем. -->
          <figure class="random-shot" hidden>
            <button type="button" aria-label="Показать другое случайное фото">
              <img alt="Случайное фото из галереи" decoding="async">
            </button>
            <figcaption></figcaption>
          </figure>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div class="copyright">Copyright 2026 Émile Alexanyan</div>
    </footer>
  </div>

  <script src="js/random-data.js?v=3c3d84b8"></script>
  <script>
    (function () {
      var list = window.RANDOM_IMAGES || [];
      var figure = document.querySelector('.random-shot');
      if (!list.length) return;
      var button = figure.querySelector('button');
      var img = figure.querySelector('img');
      var caption = figure.querySelector('figcaption');
      var current = -1;
      var queued = null;
      var token = 0;

      // Любое фото, кроме того, что уже на экране.
      function pick() {
        if (list.length < 2) return 0;
        var i;
        do {
          i = Math.floor(Math.random() * list.length);
        } while (i === current);
        return i;
      }

      function show(i) {
        var item = list[i];
        current = i;
        // Размеры заранее, чтобы место под фото резервировалось до загрузки.
        img.width = item[1];
        img.height = item[2];
        img.src = item[0];
        caption.textContent = 'img_from_my_phone:-)#' + (i + 1);
      }

      // Следующее фото выбираем и качаем, когда курсор только подошёл к
      // картинке, — к клику оно уже в кэше и смена мгновенная.
      function prepare() {
        if (queued === null) {
          queued = pick();
          new Image().src = list[queued][0];
        }
      }

      // На телефоне фото не показываем. Скрыть через CSS мало — браузер
      // всё равно скачал бы картинку, поэтому на узком экране её не выбираем
      // вовсе. Если окно потом расширят, фото подгрузится.
      var phone = window.matchMedia('(max-width: 768px)');
      function start() {
        if (phone.matches || current !== -1) return;
        show(pick());
        figure.hidden = false;
      }
      start();
      if (phone.addEventListener) {
        phone.addEventListener('change', start);
      }

      button.addEventListener('pointerenter', prepare);
      button.addEventListener('focus', prepare);
      button.addEventListener('click', function () {
        prepare();
        var i = queued;
        var t = ++token;
        queued = null;
        img.classList.add('is-changing');
        var next = new Image();
        next.onload = function () {
          if (t !== token) return;
          show(i);
          img.classList.remove('is-changing');
        };
        next.onerror = function () {
          if (t === token) img.classList.remove('is-changing');
        };
        next.src = list[i][0];
      });
    })();
  </script>
</body>
</html>
